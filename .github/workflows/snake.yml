name: Generate Contribution Snake

on:
  schedule:
    # nightly, 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: NamelessMonsterr
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=8B5CF6
            dist/snake-dark.svg?palette=github-dark&color_snake=8B5CF6&color_dots=#0D1117,#123a3a,#1b5c5c,#00b8c4,#00F5FF

      - name: push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
