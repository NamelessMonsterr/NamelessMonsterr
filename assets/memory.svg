<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Animated memory usage monitor with block-grid visualization">
  <defs>
    <linearGradient id="memGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#00FF99"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="14" fill="#0D1117"/>
  <rect width="600" height="260" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="36" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">MEM // ALLOCATION</text>

  <text x="30" y="80" font-family="Consolas, monospace" font-size="34" fill="#E8F1F2" font-weight="700">
    <tspan>4.8</tspan><tspan font-size="16" fill="#5B6B7A"> / 8 GB</tspan>
  </text>

  <g>
    <!-- 20-block memory grid, ~60% filled, refilling loop -->
    <g id="memblocks" fill="url(#memGrad)">
      <rect x="30" y="110" width="22" height="22" rx="3"/><rect x="58" y="110" width="22" height="22" rx="3"/>
      <rect x="86" y="110" width="22" height="22" rx="3"/><rect x="114" y="110" width="22" height="22" rx="3"/>
      <rect x="142" y="110" width="22" height="22" rx="3"/><rect x="170" y="110" width="22" height="22" rx="3"/>
      <rect x="198" y="110" width="22" height="22" rx="3"/><rect x="226" y="110" width="22" height="22" rx="3"/>
      <rect x="254" y="110" width="22" height="22" rx="3"/><rect x="282" y="110" width="22" height="22" rx="3"/>
      <rect x="310" y="110" width="22" height="22" rx="3"/><rect x="338" y="110" width="22" height="22" rx="3"/>
      <rect x="366" y="110" width="22" height="22" rx="3" fill="#141C26"/><rect x="394" y="110" width="22" height="22" rx="3" fill="#141C26"/>
      <rect x="422" y="110" width="22" height="22" rx="3" fill="#141C26"/><rect x="450" y="110" width="22" height="22" rx="3" fill="#141C26"/>
      <rect x="478" y="110" width="22" height="22" rx="3" fill="#141C26"/><rect x="506" y="110" width="22" height="22" rx="3" fill="#141C26"/>
      <rect x="534" y="110" width="22" height="22" rx="3" fill="#141C26"/><rect x="562" y="110" width="8" height="22" rx="3" fill="#141C26"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="30" y="170" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A">rag index cache · model weights · session state</text>
</svg>
