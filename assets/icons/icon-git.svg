<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icon representing Git version control">
  <rect width="64" height="64" rx="14" fill="#0D1117" stroke="#00F5FF" stroke-width="1.4"/>
  <line x1="24" y1="16" x2="24" y2="48" stroke="#00F5FF" stroke-width="2"/>
  <line x1="24" y1="24" x2="40" y2="24" stroke="#00F5FF" stroke-width="2"/>
  <line x1="24" y1="40" x2="40" y2="40" stroke="#00F5FF" stroke-width="2"/>
  <circle cx="24" cy="16" r="3" fill="#0D1117" stroke="#00FF99" stroke-width="2"/>
  <circle cx="24" cy="48" r="3" fill="#0D1117" stroke="#00FF99" stroke-width="2"/>
  <circle cx="40" cy="24" r="3" fill="#0D1117" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="40" cy="40" r="3" fill="#0D1117" stroke="#8B5CF6" stroke-width="2">
