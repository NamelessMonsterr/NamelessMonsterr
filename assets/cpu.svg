<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Animated CPU load monitor with waveform readout">
  <defs>
    <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="14" fill="#0D1117"/>
  <rect width="600" height="260" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="36" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">CPU // LOAD</text>

  <text x="30" y="80" font-family="Consolas, monospace" font-size="34" fill="#E8F1F2" font-weight="700">
    <tspan>62</tspan><tspan font-size="16" fill="#5B6B7A">%</tspan>
    <animate attributeName="opacity" values="1;0.85;1" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <rect x="30" y="100" width="540" height="10" rx="5" fill="#141C26"/>
  <rect x="30" y="100" height="10" rx="5" fill="url(#cpuGrad)">
    <animate attributeName="width" values="180;380;240;420;180" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <polyline points="30,220 70,190 110,230 150,160 190,210 230,170 270,240 310,150 350,200 390,180 430,220 470,160 510,210 550,190"
            fill="none" stroke="#00F5FF" stroke-width="1.6" opacity="0.85">
    <animate attributeName="points"
      values="30,220 70,190 110,230 150,160 190,210 230,170 270,240 310,150 350,200 390,180 430,220 470,160 510,210 550,190;
               30,190 70,230 110,160 150,210 190,170 230,240 270,150 310,200 350,180 390,220 430,160 470,210 510,190 550,230;
               30,220 70,190 110,230 150,160 190,210 230,170 270,240 310,150 350,200 390,180 430,220 470,160 510,210 550,190"
      dur="2.8s" repeatCount="indefinite"/>
  </polyline>
</svg>
