<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Rotating AI core visualization with pulsing central node and three orbiting rings">
  <defs>
    <radialGradient id="coreCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F1F2"/>
      <stop offset="35%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#00F5FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF99"/><stop offset="100%" stop-color="#00FF99" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="14" fill="#0D1117"/>
  <rect width="600" height="400" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="36" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">CORE // IDLE STATE</text>

  <g transform="translate(300,215)">
    <circle r="26" fill="url(#coreCenter)">
      <animate attributeName="r" values="24;29;24" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <ellipse rx="150" ry="55" fill="none" stroke="url(#ringA)" stroke-width="1.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="150" ry="55" fill="none" stroke="url(#ringB)" stroke-width="1.4" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="150" ry="55" fill="none" stroke="url(#ringC)" stroke-width="1.2" transform="rotate(120)">
      <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- satellites riding the rings -->
    <circle r="4" fill="#00F5FF"><animateMotion path="M150,0 A150,55 0 1,1 -150,0 A150,55 0 1,1 150,0" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#8B5CF6"><animateMotion path="M150,0 A150,55 0 1,1 -150,0 A150,55 0 1,1 150,0" dur="13s" repeatCount="indefinite" begin="-3s"/></circle>
    <circle r="3" fill="#00FF99"><animateMotion path="M150,0 A150,55 0 1,1 -150,0 A150,55 0 1,1 150,0" dur="16s" repeatCount="indefinite" begin="-6s"/></circle>
  </g>

  <g font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" text-anchor="middle">
    <text x="300" y="368">reasoning · retrieval · generation — orbiting the same center</text>
  </g>
</svg>
