<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Knowledge graph connecting core skills, tools, and domains as a node network">
  <defs>
    <linearGradient id="kgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="14" fill="#0D1117"/>
  <rect width="1200" height="380" rx="14" fill="none" stroke="#1B2733"/>
  <text x="40" y="40" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">KNOWLEDGE GRAPH // DOMAIN LINKS</text>

  <g stroke="#1B2733" stroke-width="1" fill="none">
    <path d="M600,190 L300,90"/><path d="M600,190 L300,290"/><path d="M600,190 L900,90"/>
    <path d="M600,190 L900,290"/><path d="M300,90 L150,190"/><path d="M300,290 L150,190"/>
    <path d="M900,90 L1050,190"/><path d="M900,290 L1050,190"/><path d="M300,90 L600,60"/>
    <path d="M900,90 L600,60"/><path d="M300,290 L600,330"/><path d="M900,290 L600,330"/>
  </g>
  <g stroke="url(#kgGrad)" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M600,190 L300,90"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M600,190 L900,290"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M300,290 L150,190"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.3s" repeatCount="indefinite"/></path>
    <path d="M900,90 L1050,190"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.9s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="Consolas, monospace" font-size="11" text-anchor="middle">
    <circle cx="600" cy="190" r="30" fill="#0D1117" stroke="#00F5FF" stroke-width="1.8"/>
    <text x="600" y="194" fill="#E8F1F2" font-size="12">AI Eng</text>

    <circle cx="300" cy="90" r="22" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/><text x="300" y="94" fill="#C9D1D9">RAG</text>
    <circle cx="300" cy="290" r="22" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/><text x="300" y="294" fill="#C9D1D9">Multi-Agent</text>
    <circle cx="900" cy="90" r="22" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/><text x="900" y="94" fill="#C9D1D9">FastAPI</text>
    <circle cx="900" cy="290" r="22" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/><text x="900" y="294" fill="#C9D1D9">React</text>

    <circle cx="150" cy="190" r="18" fill="#0D1117" stroke="#5B6B7A" stroke-width="1.4"/><text x="150" y="194" fill="#8FA3B0" font-size="10">FAISS</text>
    <circle cx="1050" cy="190" r="18" fill="#0D1117" stroke="#5B6B7A" stroke-width="1.4"/><text x="1050" y="194" fill="#8FA3B0" font-size="10">Docker</text>
    <circle cx="600" cy="60" r="18" fill="#0D1117" stroke="#5B6B7A" stroke-width="1.4"/><text x="600" y="64" fill="#8FA3B0" font-size="10">IEEE writing</text>
    <circle cx="600" cy="330" r="18" fill="#0D1117" stroke="#5B6B7A" stroke-width="1.4"/><text x="600" y="334" fill="#8FA3B0" font-size="10">VTU coursework</text>
  </g>

  <circle r="3" fill="#E8F1F2"><animateMotion path="M600,190 L300,90 L150,190 L300,290 L600,190" dur="6s" repeatCount="indefinite"/></circle>
</svg>
