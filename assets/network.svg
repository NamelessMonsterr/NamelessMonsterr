<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Service mesh network diagram connecting API gateway, vector store, LLM, auth, database, and client">
  <defs>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/><stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="380" rx="14" fill="#0D1117"/>
  <rect width="1200" height="380" rx="14" fill="none" stroke="#1B2733"/>
  <text x="40" y="42" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">NETWORK TOPOLOGY // SERVICE MESH</text>

  <!-- central hub -->
  <circle cx="600" cy="210" r="70" fill="url(#netGlow)"/>
  <circle cx="600" cy="210" r="34" fill="#0D1117" stroke="#00F5FF" stroke-width="1.8"/>
  <text x="600" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#E8F1F2">CORE</text>
  <circle cx="600" cy="210" r="46" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="3 8" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- satellite nodes -->
  <g font-family="Consolas, monospace" font-size="11" fill="#8FA3B0" text-anchor="middle">
    <!-- node: API gateway -->
    <line x1="600" y1="210" x2="280" y2="90" stroke="#8B5CF6" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/></line>
    <circle cx="280" cy="90" r="22" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/>
    <text x="280" y="94" fill="#E8F1F2" font-size="10">API</text><text x="280" y="122">gateway</text>

    <!-- node: vector store -->
    <line x1="600" y1="210" x2="230" y2="260" stroke="#00FF99" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/></line>
    <circle cx="230" cy="260" r="22" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/>
    <text x="230" y="264" fill="#E8F1F2" font-size="10">FAISS</text><text x="230" y="292">vector store</text>

    <!-- node: LLM provider -->
    <line x1="600" y1="210" x2="360" y2="330" stroke="#00F5FF" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.7s" repeatCount="indefinite"/></line>
    <circle cx="360" cy="330" r="22" fill="#0D1117" stroke="#00F5FF" stroke-width="1.6"/>
    <text x="360" y="334" fill="#E8F1F2" font-size="10">LLM</text><text x="360" y="358">inference</text>

    <!-- node: auth -->
    <line x1="600" y1="210" x2="920" y2="90" stroke="#00F5FF" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" repeatCount="indefinite"/></line>
    <circle cx="920" cy="90" r="22" fill="#0D1117" stroke="#00F5FF" stroke-width="1.6"/>
    <text x="920" y="94" fill="#E8F1F2" font-size="10">AUTH</text><text x="920" y="122">identity</text>

    <!-- node: postgres -->
    <line x1="600" y1="210" x2="970" y2="260" stroke="#8B5CF6" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.3s" repeatCount="indefinite"/></line>
    <circle cx="970" cy="260" r="22" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/>
    <text x="970" y="264" fill="#E8F1F2" font-size="10">SQL</text><text x="970" y="292">persistence</text>

    <!-- node: client -->
    <line x1="600" y1="210" x2="840" y2="330" stroke="#00FF99" stroke-width="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.5s" repeatCount="indefinite"/></line>
    <circle cx="840" cy="330" r="22" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/>
    <text x="840" y="334" fill="#E8F1F2" font-size="10">UI</text><text x="840" y="358">React client</text>
  </g>

  <!-- traveling packets -->
  <circle r="3" fill="#00F5FF"><animateMotion path="M600,210 L280,90" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#00FF99"><animateMotion path="M230,260 L600,210" dur="3s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#8B5CF6"><animateMotion path="M600,210 L970,260" dur="3.3s" repeatCount="indefinite"/></circle>
</svg>
