<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Concentric orbiting rings representing layered system architecture, from client to core">
  <defs>
    <radialGradient id="orbitCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="14" fill="#0D1117"/>
  <rect width="600" height="400" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="36" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">ORBITS // ARCHITECTURE LAYERS</text>

  <g transform="translate(300,215)">
    <circle r="150" fill="url(#orbitCenter)"/>
    <circle r="34" fill="#0D1117" stroke="#00F5FF" stroke-width="1.8"/>
    <text text-anchor="middle" y="5" font-family="Consolas, monospace" font-size="11" fill="#E8F1F2">CORE</text>

    <circle r="70" fill="none" stroke="#1B2733" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="2 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="110" fill="none" stroke="#1B2733" stroke-width="1"/>
    <circle r="110" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 12" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="150" fill="none" stroke="#1B2733" stroke-width="1"/>
    <circle r="150" fill="none" stroke="#00FF99" stroke-width="1" stroke-dasharray="2 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Consolas, monospace" font-size="10">
      <circle cx="70" cy="0" r="5" fill="#00F5FF"/><text x="70" y="-12" text-anchor="middle" fill="#8FA3B0">service</text>
      <circle cx="-95" cy="55" r="5" fill="#8B5CF6"/><text x="-95" y="42" text-anchor="middle" fill="#8FA3B0">gateway</text>
      <circle cx="106" cy="106" r="5" fill="#00FF99"/><text x="106" y="123" text-anchor="middle" fill="#8FA3B0">client</text>
    </g>
  </g>

  <text x="300" y="380" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A">every layer orbits the same core contract</text>
</svg>
