<svg width="600" height="280" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project card for DeepDiveMysteries, an exploratory Python repository">
  <defs>
    <linearGradient id="ddBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#00FF99"/>
    </linearGradient>
    <radialGradient id="ddGlow" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.15"/><stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="596" height="276" rx="14" fill="#0D1117" stroke="url(#ddBorder)" stroke-width="1.6">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="596" height="276" rx="14" fill="url(#ddGlow)"/>

  <circle cx="26" cy="28" r="5" fill="#00F5FF"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="40" y="33" font-family="Consolas, monospace" font-size="11" fill="#00F5FF" letter-spacing="1">ACTIVE</text>
  <text x="574" y="33" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A">exploratory</text>

  <text x="26" y="76" font-family="Consolas, monospace" font-size="24" fill="#E8F1F2" font-weight="700">🔎 DeepDiveMysteries</text>
  <text x="26" y="102" font-family="Consolas, monospace" font-size="12" fill="#8FA3B0">investigation &amp; analysis, open for exploration</text>

  <text x="26" y="134" font-family="Consolas, monospace" font-size="12" fill="#C9D1D9">
    <tspan x="26" dy="0">A smaller, exploratory repo — less polished than the flagship builds,</tspan>
    <tspan x="26" dy="16">kept open for anyone curious enough to dig in.</tspan>
  </text>

  <g font-family="Consolas, monospace" font-size="10" fill="#00F5FF">
    <rect x="26" y="200" width="70" height="22" rx="11" fill="none" stroke="#00F5FF"/><text x="61" y="214" text-anchor="middle">Python</text>
  </g>

  <line x1="26" y1="240" x2="574" y2="240" stroke="#1B2733"/>
  <text x="26" y="262" font-family="Consolas, monospace" font-size="12" fill="#00F5FF">→ github.com/NamelessMonsterr/DeepDiveMysteries</text>
</svg>
