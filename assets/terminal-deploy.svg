<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated CI/CD deployment log terminal screen">
  <rect width="1200" height="280" rx="14" fill="#080B10"/>
  <rect width="1200" height="280" rx="14" fill="none" stroke="#00FF99" stroke-width="1" opacity="0.5"/>
  <rect width="1200" height="34" rx="14" fill="#0F1620"/>
  <rect y="20" width="1200" height="14" fill="#0F1620"/>
  <circle cx="24" cy="17" r="5.5" fill="#FF5F56"/><circle cx="44" cy="17" r="5.5" fill="#FFBD2E"/><circle cx="64" cy="17" r="5.5" fill="#27C93F"/>
  <text x="600" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" letter-spacing="2">deploy.log — build pipeline</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#C9D1D9">
    <text x="26" y="66" fill="#00F5FF">$ git push origin main</text>
    <text x="26" y="92" opacity="0">→ triggered build #482<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze"/></text>
    <text x="26" y="116" opacity="0">→ installing dependencies......... <tspan fill="#00FF99">done</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze"/></text>
    <text x="26" y="140" opacity="0">→ running test suite (41 tests)... <tspan fill="#00FF99">passed</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze"/></text>
    <text x="26" y="164" opacity="0">→ building container image....... <tspan fill="#00FF99">done</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.1s" fill="freeze"/></text>
    <text x="26" y="188" opacity="0">→ pushing to registry............. <tspan fill="#00FF99">done</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.7s" fill="freeze"/></text>
    <text x="26" y="212" opacity="0">→ rolling out — 0% </text>
    <rect x="140" y="200" width="200" height="10" rx="5" fill="#141C26" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.0s" fill="freeze"/></rect>
    <rect x="140" y="200" width="0" height="10" rx="5" fill="#00FF99">
      <animate attributeName="width" from="0" to="200" dur="1.2s" begin="3.1s" fill="freeze"/>
    </rect>
    <text x="26" y="246" fill="#00F5FF" font-weight="700" opacity="0">deploy complete — build #482 live.<animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.3s" fill="freeze"/></text>
  </g>
</svg>
