<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated system diagnostics terminal screen running self-checks">
  <rect width="1200" height="320" rx="14" fill="#080B10"/>
  <rect width="1200" height="320" rx="14" fill="none" stroke="#1B2733"/>
  <rect width="1200" height="34" rx="14" fill="#0F1620"/>
  <rect y="20" width="1200" height="14" fill="#0F1620"/>
  <circle cx="24" cy="17" r="5.5" fill="#FF5F56"/><circle cx="44" cy="17" r="5.5" fill="#FFBD2E"/><circle cx="64" cy="17" r="5.5" fill="#27C93F"/>
  <text x="600" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" letter-spacing="2">diagnostics.sh — self-check</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#C9D1D9">
    <text x="26" y="66" fill="#00F5FF">$ ./diagnostics.sh --full</text>

    <text x="26" y="94" opacity="0">checking runtime.......... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze"/></text>
    <text x="26" y="118" opacity="0">checking dependencies..... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.8s" fill="freeze"/></text>
    <text x="26" y="142" opacity="0">checking vector index..... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" fill="freeze"/></text>
    <text x="26" y="166" opacity="0">checking model weights.... <tspan fill="#FFBD2E">warn: stale cache, refreshing</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/></text>
    <text x="26" y="190" opacity="0">refreshing cache........... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.2s" fill="freeze"/></text>
    <text x="26" y="214" opacity="0">checking API routes....... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.6s" fill="freeze"/></text>
    <text x="26" y="238" opacity="0">checking auth chain....... <tspan fill="#00FF99">pass</tspan><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.0s" fill="freeze"/></text>

    <text x="26" y="272" font-weight="700" opacity="0" fill="#00F5FF">7/7 checks complete — system nominal.
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.5s" fill="freeze"/>
    </text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.8s" fill="freeze"/>
      <text x="26" y="298" fill="#5B6B7A">hammad@core:~$</text>
      <rect x="150" y="286" width="8" height="15" fill="#00FF99"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="3.8s"/></rect>
    </g>
  </g>
</svg>
