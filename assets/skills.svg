<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated skill matrix showing self-rated proficiency bars across core technologies">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="14" fill="#0D1117"/>
  <rect width="1200" height="360" rx="14" fill="none" stroke="#1B2733"/>
  <text x="40" y="42" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">SKILL MATRIX // SELF-ASSESSED PROFICIENCY</text>

  <g font-family="Consolas, monospace" font-size="14">
    <!-- row template: label, track, animated fill, % -->
    <!-- Python 95 -->
    <text x="40" y="90" fill="#E8F1F2">Python</text>
    <rect x="220" y="76" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="76" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="779" dur="1.6s" fill="freeze" begin="0.1s"/>
    </rect>
    <text x="1060" y="88" fill="#00FF99">95%</text>

    <!-- FastAPI 90 -->
    <text x="40" y="132" fill="#E8F1F2">FastAPI</text>
    <rect x="220" y="118" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="118" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="738" dur="1.6s" fill="freeze" begin="0.25s"/>
    </rect>
    <text x="1060" y="130" fill="#00FF99">90%</text>

    <!-- LLMs / RAG 92 -->
    <text x="40" y="174" fill="#E8F1F2">LLMs &amp; RAG</text>
    <rect x="220" y="160" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="160" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="754" dur="1.6s" fill="freeze" begin="0.4s"/>
    </rect>
    <text x="1060" y="172" fill="#00FF99">92%</text>

    <!-- React 78 -->
    <text x="40" y="216" fill="#E8F1F2">React</text>
    <rect x="220" y="202" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="202" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="640" dur="1.6s" fill="freeze" begin="0.55s"/>
    </rect>
    <text x="1060" y="214" fill="#00FF99">78%</text>

    <!-- Multi-agent systems 85 -->
    <text x="40" y="258" fill="#E8F1F2">Multi-Agent Systems</text>
    <rect x="220" y="244" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="244" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="697" dur="1.6s" fill="freeze" begin="0.7s"/>
    </rect>
    <text x="1060" y="256" fill="#00FF99">85%</text>

    <!-- Git 88 -->
    <text x="40" y="300" fill="#E8F1F2">Git</text>
    <rect x="220" y="286" width="820" height="14" rx="7" fill="#141C26"/>
    <rect x="220" y="286" height="14" rx="7" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="722" dur="1.6s" fill="freeze" begin="0.85s"/>
    </rect>
    <text x="1060" y="298" fill="#00FF99">88%</text>
  </g>
  <text x="40" y="336" font-family="Consolas, monospace" font-size="11" fill="#3D4A57">self-rated, not benchmarked — take with a coffee</text>
</svg>
