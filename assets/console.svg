<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated AI console session answering identity, project status, and philosophy">
  <rect width="1200" height="300" rx="14" fill="#080B10"/>
  <rect width="1200" height="300" rx="14" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
  <rect width="1200" height="34" rx="14" fill="#0F1620"/>
  <rect y="20" width="1200" height="14" fill="#0F1620"/>
  <circle cx="24" cy="17" r="5.5" fill="#FF5F56"/><circle cx="44" cy="17" r="5.5" fill="#FFBD2E"/><circle cx="64" cy="17" r="5.5" fill="#27C93F"/>
  <text x="600" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" letter-spacing="2">core &gt; interactive session</text>

  <g font-family="Consolas, monospace" font-size="13">
    <text x="26" y="66" fill="#00F5FF">core&gt; whoami</text>
    <text x="26" y="90" fill="#C9D1D9" opacity="0">Abdul Baseer Hammad — backend + AI engineer.<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/></text>

    <text x="26" y="126" fill="#00F5FF" opacity="0">core&gt; status --projects<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.1s" fill="freeze"/></text>
    <text x="26" y="150" fill="#C9D1D9" opacity="0">HealthX: active · FaultSeeker++: published · SETRS: active<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/></text>

    <text x="26" y="186" fill="#00F5FF" opacity="0">core&gt; philosophy --print<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.2s" fill="freeze"/></text>
    <text x="26" y="210" fill="#00FF99" opacity="0">"Complex ideas deserve simple, reliable software."<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.7s" fill="freeze"/></text>

    <text x="26" y="246" fill="#8B5CF6" opacity="0">core&gt; _<animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.3s" fill="freeze"/></text>
    <rect x="55" y="234" width="8" height="15" fill="#8B5CF6" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="3.3s"/>
    </rect>
  </g>
</svg>
