<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated encrypted access log terminal screen">
  <rect width="1200" height="280" rx="14" fill="#080B10"/>
  <rect width="1200" height="280" rx="14" fill="none" stroke="#1B2733"/>
  <rect width="1200" height="34" rx="14" fill="#0F1620"/>
  <rect y="20" width="1200" height="14" fill="#0F1620"/>
  <circle cx="24" cy="17" r="5.5" fill="#FF5F56"/><circle cx="44" cy="17" r="5.5" fill="#FFBD2E"/><circle cx="64" cy="17" r="5.5" fill="#27C93F"/>
  <text x="600" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" letter-spacing="2">access.log — encrypted channel</text>
  <text x="1170" y="22" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#5B6B7A" letter-spacing="1" opacity="0.8">SIMULATED</text>

  <g font-family="Consolas, monospace" font-size="12" fill="#5B6B7A">
    <text x="26" y="64" opacity="0">session opened :: token issued<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze"/></text>
    <text x="26" y="86" opacity="0">key exchange ok :: channel secured<animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.6s" fill="freeze"/></text>
    <text x="26" y="108" opacity="0">identity verified :: access granted<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.0s" fill="freeze"/></text>
    <text x="26" y="130" fill="#00F5FF" opacity="0">0x4E: decrypting visitor.greeting.....<animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/></text>
    <text x="26" y="160" fill="#E8F1F2" font-size="16" opacity="0">&gt; "thanks for actually reading the source."<animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/></text>
    <text x="26" y="190" fill="#00FF99" opacity="0">0x5F: session integrity — nominal<animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.8s" fill="freeze"/></text>
  </g>
  <rect x="26" y="200" width="8" height="15" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.1s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="3.1s"/>
  </rect>
</svg>
