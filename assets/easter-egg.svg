<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hidden ASCII message encoded in binary as a scrolling reward">
  <rect width="1200" height="220" rx="14" fill="#080B10"/>
  <rect width="1200" height="220" rx="14" fill="none" stroke="#1B2733"/>

  <text x="600" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3D4A57" letter-spacing="3">
    // you scrolled this far — decode the line below, it's a real ASCII message
  </text>

  <text x="600" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#00FF99" letter-spacing="3">
    01010011 01001000 01001001 01010000 00100000 01001001 01010100
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3D4A57">
    (hint: each 8-bit group is one ASCII character)
  </text>

  <g font-family="Consolas, monospace" font-size="12" fill="#5B6B7A" text-anchor="middle">
    <text x="600" y="170">no fake progress bars, no invented benchmarks —</text>
    <text x="600" y="190">everything above rendered from the .svg files in this repo.</text>
  </g>
</svg>
