<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Circular boot progress indicator completing a startup sequence">
  <defs>
    <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="14" fill="#0D1117"/>
  <rect width="300" height="300" rx="14" fill="none" stroke="#1B2733"/>

  <g transform="translate(150,140)">
    <circle r="90" fill="none" stroke="#141C26" stroke-width="8"/>
    <circle r="90" fill="none" stroke="url(#bootGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="565" stroke-dashoffset="565" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="565" to="0" dur="3.5s" fill="freeze" begin="0.2s"/>
    </circle>

    <text text-anchor="middle" y="-6" font-family="Consolas, monospace" font-size="12" fill="#5B6B7A" letter-spacing="2" opacity="1">
      BOOTING
      <animate attributeName="opacity" values="1;0" dur="0.3s" begin="3.6s" fill="freeze"/>
    </text>
    <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="22" fill="#E8F1F2" font-weight="700" opacity="0">
      READY
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.6s" fill="freeze"/>
    </text>
    <text text-anchor="middle" y="24" font-family="Consolas, monospace" font-size="11" fill="#00FF99" opacity="0">
      core online
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.7s" fill="freeze"/>
    </text>
  </g>
</svg>
