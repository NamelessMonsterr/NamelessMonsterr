<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Project database index listing all active repositories with status and stack">
  <rect width="1200" height="300" rx="14" fill="#0D1117"/>
  <rect width="1200" height="300" rx="14" fill="none" stroke="#1B2733"/>
  <text x="40" y="40" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">PROJECT DATABASE // SELECT * FROM repos</text>

  <g font-family="Consolas, monospace" font-size="12">
    <line x1="40" y1="58" x2="1160" y2="58" stroke="#1B2733"/>
    <text x="40" y="54" fill="#5B6B7A">NAME</text>
    <text x="420" y="54" fill="#5B6B7A">STATUS</text>
    <text x="560" y="54" fill="#5B6B7A">STACK</text>
    <text x="1000" y="54" fill="#5B6B7A">TYPE</text>

    <g>
      <text x="40" y="90" fill="#E8F1F2" opacity="0">HealthX<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/></text>
      <circle cx="428" cy="86" r="4" fill="#00FF99" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/></circle>
      <text x="440" y="90" fill="#00FF99" opacity="0">active<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/></text>
      <text x="560" y="90" fill="#8FA3B0" opacity="0">Python · FastAPI · RAG · React<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/></text>
      <text x="1000" y="90" fill="#00F5FF" opacity="0">clinical AI<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/></text>
    </g>
    <line x1="40" y1="106" x2="1160" y2="106" stroke="#141C26"/>

    <g>
      <text x="40" y="136" fill="#E8F1F2" opacity="0">FaultSeeker++<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></text>
      <circle cx="428" cy="132" r="4" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></circle>
      <text x="440" y="136" fill="#8B5CF6" opacity="0">published<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></text>
      <text x="560" y="136" fill="#8FA3B0" opacity="0">Multi-Agent LLMs · IEEE<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></text>
      <text x="1000" y="136" fill="#00F5FF" opacity="0">security research<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></text>
    </g>
    <line x1="40" y1="152" x2="1160" y2="152" stroke="#141C26"/>

    <g>
      <text x="40" y="182" fill="#E8F1F2" opacity="0">SETRS<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
      <circle cx="428" cy="178" r="4" fill="#00FF99" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></circle>
      <text x="440" y="182" fill="#00FF99" opacity="0">active<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
      <text x="560" y="182" fill="#8FA3B0" opacity="0">React · Simulation<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
      <text x="1000" y="182" fill="#00F5FF" opacity="0">traffic systems<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
    </g>
    <line x1="40" y1="198" x2="1160" y2="198" stroke="#141C26"/>

    <g>
      <text x="40" y="228" fill="#E8F1F2" opacity="0">DeepDiveMysteries<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
      <circle cx="428" cy="224" r="4" fill="#00F5FF" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></circle>
      <text x="440" y="228" fill="#00F5FF" opacity="0">active<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
      <text x="560" y="228" fill="#8FA3B0" opacity="0">Python<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
      <text x="1000" y="228" fill="#00F5FF" opacity="0">exploratory<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text>
    </g>
  </g>

  <text x="40" y="270" font-family="Consolas, monospace" font-size="11" fill="#5B6B7A" opacity="0">4 rows returned
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
  </text>
</svg>
