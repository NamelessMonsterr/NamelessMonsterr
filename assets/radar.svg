<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radar scanner sweeping for open-source collaborations and roles">
  <defs>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00FF99" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00FF99" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="150" cy="150" r="120"/></clipPath>
  </defs>
  <rect width="600" height="300" rx="14" fill="#0D1117"/>
  <rect width="600" height="300" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="34" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">SCANNER // OPPORTUNITY RADAR</text>

  <g transform="translate(0,20)">
    <circle cx="150" cy="150" r="120" fill="#0A0F16" stroke="#1B2733"/>
    <circle cx="150" cy="150" r="90" fill="none" stroke="#1B2733"/>
    <circle cx="150" cy="150" r="60" fill="none" stroke="#1B2733"/>
    <circle cx="150" cy="150" r="30" fill="none" stroke="#1B2733"/>
    <line x1="30" y1="150" x2="270" y2="150" stroke="#1B2733"/>
    <line x1="150" y1="30" x2="150" y2="270" stroke="#1B2733"/>

    <g clip-path="url(#radarClip)">
      <path d="M150,150 L150,30 A120,120 0 0,1 253,90 Z" fill="url(#sweepGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- blips -->
    <circle cx="190" cy="100" r="4" fill="#00F5FF"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="110" cy="190" r="4" fill="#8B5CF6"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1.9s"/></circle>
    <circle cx="200" cy="200" r="4" fill="#00FF99"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="2.8s"/></circle>
    <circle cx="90" cy="110" r="3.4" fill="#E8F1F2"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1.1s"/></circle>

    <circle cx="150" cy="150" r="3" fill="#E8F1F2"/>
  </g>

  <g font-family="Consolas, monospace" font-size="11" fill="#8FA3B0">
    <text x="330" y="70" fill="#00F5FF">TRACKING</text>
    <text x="330" y="92">→ open-source collabs</text>
    <text x="330" y="112">→ backend / AI roles</text>
    <text x="330" y="132">→ interesting hard problems</text>
    <text x="330" y="160" fill="#3D4A57">range: unlimited · noise: low</text>
  </g>
</svg>
