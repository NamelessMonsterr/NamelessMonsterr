<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the AI request pipeline from Python through FastAPI, LLMs, RAG, backend, and deploy">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="nodeG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" rx="14" fill="#0D1117"/>
  <rect width="1200" height="240" rx="14" fill="none" stroke="#1B2733"/>

  <text x="600" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">SIGNAL PATH // REQUEST → RESPONSE</text>

  <!-- base line -->
  <line x1="90" y1="140" x2="1110" y2="140" stroke="#1B2733" stroke-width="2"/>
  <!-- animated flow -->
  <line x1="90" y1="140" x2="1110" y2="140" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="240;0" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <g font-family="Consolas, monospace" font-size="14" fill="#E8F1F2" text-anchor="middle">
    <!-- 6 nodes -->
    <g>
      <circle cx="90" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="90" cy="140" r="18" fill="#0D1117" stroke="#00F5FF" stroke-width="1.6"/>
      <text x="90" y="145">Py</text>
      <text x="90" y="185" fill="#8FA3B0" font-size="12">Python</text>
    </g>
    <g>
      <circle cx="294" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="294" cy="140" r="18" fill="#0D1117" stroke="#00F5FF" stroke-width="1.6"/>
      <text x="294" y="145" font-size="11">API</text>
      <text x="294" y="185" fill="#8FA3B0" font-size="12">FastAPI</text>
    </g>
    <g>
      <circle cx="498" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="498" cy="140" r="18" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/>
      <text x="498" y="145" font-size="11">LLM</text>
      <text x="498" y="185" fill="#8FA3B0" font-size="12">LLMs</text>
    </g>
    <g>
      <circle cx="702" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="702" cy="140" r="18" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.6"/>
      <text x="702" y="145" font-size="11">RAG</text>
      <text x="702" y="185" fill="#8FA3B0" font-size="12">Retrieval</text>
    </g>
    <g>
      <circle cx="906" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="906" cy="140" r="18" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/>
      <text x="906" y="145" font-size="11">SVC</text>
      <text x="906" y="185" fill="#8FA3B0" font-size="12">Backend</text>
    </g>
    <g>
      <circle cx="1110" cy="140" r="26" fill="url(#nodeG)"/>
      <circle cx="1110" cy="140" r="18" fill="#0D1117" stroke="#00FF99" stroke-width="1.6"/>
      <text x="1110" y="145" font-size="11">&gt;_</text>
      <text x="1110" y="185" fill="#8FA3B0" font-size="12">Deploy</text>
    </g>
  </g>

  <!-- pulse ping traveling across -->
  <circle r="5" fill="#00FF99">
    <animateMotion path="M90,140 L294,140 L498,140 L702,140 L906,140 L1110,140" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
