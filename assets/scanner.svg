<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Linear scanning beam sweeping across a data grid, highlighting cells as it passes">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF99" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF99" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF99" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gridClip"><rect x="30" y="50" width="540" height="200" rx="8"/></clipPath>
  </defs>
  <rect width="600" height="300" rx="14" fill="#0D1117"/>
  <rect width="600" height="300" rx="14" fill="none" stroke="#1B2733"/>
  <text x="30" y="30" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#5B6B7A">SCANNER // REPO INDEX</text>

  <rect x="30" y="50" width="540" height="200" rx="8" fill="#0A0F16" stroke="#1B2733"/>

  <g clip-path="url(#gridClip)">
    <g stroke="#141C26">
      <line x1="30" y1="90" x2="570" y2="90"/><line x1="30" y1="130" x2="570" y2="130"/>
      <line x1="30" y1="170" x2="570" y2="170"/><line x1="30" y1="210" x2="570" y2="210"/>
      <line x1="120" y1="50" x2="120" y2="250"/><line x1="210" y1="50" x2="210" y2="250"/>
      <line x1="300" y1="50" x2="300" y2="250"/><line x1="390" y1="50" x2="390" y2="250"/>
      <line x1="480" y1="50" x2="480" y2="250"/>
    </g>
    <g fill="#00F5FF" opacity="0.55">
      <rect x="122" y="92" width="86" height="36"/><rect x="302" y="132" width="86" height="36"/>
      <rect x="32" y="172" width="86" height="36"/><rect x="392" y="212" width="86" height="36"/>
      <rect x="212" y="212" width="86" height="36"/>
    </g>
    <rect x="0" y="50" width="30" height="200" fill="url(#beamGrad)">
      <animate attributeName="x" values="0;570;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Consolas, monospace" font-size="11" fill="#5B6B7A">
    <text x="30" y="272">scanning: repositories, commits, dependencies — indexed left to right</text>
  </g>
</svg>
