<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ship-cadence line chart and language-split donut chart">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="14" fill="#0D1117"/>
  <rect width="1200" height="360" rx="14" fill="none" stroke="#1B2733"/>
  <text x="40" y="40" font-family="Consolas, monospace" font-size="13" letter-spacing="4" fill="#5B6B7A">ANALYTICS // SHIP CADENCE</text>

  <!-- line/area chart -->
  <g transform="translate(40,60)">
    <g stroke="#1B2733"><line x1="0" y1="220" x2="520" y2="220"/><line x1="0" y1="0" x2="0" y2="220"/></g>
    <path d="M0,180 L75,140 L150,160 L225,90 L300,110 L375,55 L450,70 L520,30 L520,220 L0,220 Z" fill="url(#areaGrad)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
    </path>
    <polyline points="0,180 75,140 150,160 225,90 300,110 375,55 450,70 520,30" fill="none" stroke="url(#lineGrad2)" stroke-width="2.4"
              stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" from="900" to="0" dur="1.4s" begin="0.2s" fill="freeze"/>
    </polyline>
    <g fill="#0D1117" stroke="#00F5FF" stroke-width="2">
      <circle cx="0" cy="180" r="3.5"/><circle cx="75" cy="140" r="3.5"/><circle cx="150" cy="160" r="3.5"/>
      <circle cx="225" cy="90" r="3.5"/><circle cx="300" cy="110" r="3.5"/><circle cx="375" cy="55" r="3.5"/>
      <circle cx="450" cy="70" r="3.5"/><circle cx="520" cy="30" r="3.5"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10" fill="#5B6B7A" text-anchor="middle">
      <text x="0" y="238">W1</text><text x="75" y="238">W2</text><text x="150" y="238">W3</text><text x="225" y="238">W4</text>
      <text x="300" y="238">W5</text><text x="375" y="238">W6</text><text x="450" y="238">W7</text><text x="520" y="238">W8</text>
    </g>
    <text x="0" y="-8" font-family="Consolas, monospace" font-size="11" fill="#00FF99">commits per week — trending up</text>
  </g>

  <!-- donut: language split -->
  <g transform="translate(760,175)">
    <circle r="90" fill="none" stroke="#141C26" stroke-width="26"/>
    <circle r="90" fill="none" stroke="#00F5FF" stroke-width="26" stroke-dasharray="330 565" stroke-dashoffset="0" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 565" to="330 565" dur="1.2s" begin="0.4s" fill="freeze"/>
    </circle>
    <circle r="90" fill="none" stroke="#8B5CF6" stroke-width="26" stroke-dasharray="150 565" stroke-dashoffset="-330" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 565" to="150 565" dur="1.2s" begin="0.6s" fill="freeze"/>
    </circle>
    <circle r="90" fill="none" stroke="#00FF99" stroke-width="26" stroke-dasharray="85 565" stroke-dashoffset="-480" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 565" to="85 565" dur="1.2s" begin="0.8s" fill="freeze"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#E8F1F2">LANG</text>
  </g>
  <g transform="translate(920,110)" font-family="Consolas, monospace" font-size="12" fill="#8FA3B0">
    <rect x="0" y="0" width="10" height="10" fill="#00F5FF"/><text x="18" y="10">Python</text>
    <rect x="0" y="26" width="10" height="10" fill="#8B5CF6"/><text x="18" y="36">TypeScript / React</text>
    <rect x="0" y="52" width="10" height="10" fill="#00FF99"/><text x="18" y="62">Other</text>
  </g>
</svg>
