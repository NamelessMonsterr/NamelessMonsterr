<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="pulseG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF99" stop-opacity="0.9"/><stop offset="100%" stop-color="#00FF99" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#1B2733" stroke-width="1"/>
  <circle cx="600" cy="20" r="4" fill="#00FF99"/>
  <circle cx="600" cy="20" r="4" fill="url(#pulseG)">
    <animate attributeName="r" values="4;60;4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
