<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mission statement panel styled as a holographic directive">
  <defs>
    <linearGradient id="missionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="missionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.18"/><stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" rx="14" fill="#0D1117"/>
  <rect width="1200" height="240" rx="14" fill="none" stroke="url(#missionGrad)" stroke-width="1" opacity="0.5"/>
  <rect width="1200" height="240" fill="url(#missionGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets, holographic frame -->
  <g stroke="#00F5FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 40 V20 H40"/><path d="M1180 40 V20 H1160"/>
    <path d="M20 200 V220 H40"/><path d="M1180 200 V220 H1160"/>
  </g>

  <text x="600" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="6" fill="#5B6B7A">MISSION DIRECTIVE</text>

  <text x="600" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#E8F1F2" font-weight="600">
    Complex ideas deserve simple, reliable software.
  </text>

  <text x="600" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8FA3B0">
    Build backend systems and AI agents that hold up outside a demo.
  </text>

  <g font-family="Consolas, monospace" font-size="11" fill="#00FF99" text-anchor="middle">
    <text x="300" y="205">// scope small</text>
    <text x="600" y="205">// ship real systems</text>
    <text x="900" y="205">// iterate in public</text>
  </g>
</svg>
